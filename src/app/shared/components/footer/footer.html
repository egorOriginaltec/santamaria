<footer class="border-t border-neutral-200 bg-white">
  <div class="mx-auto grid max-w-7xl gap-6 px-4 py-12 sm:px-6 lg:grid-cols-[1.3fr_1fr] lg:px-8">
    <div>
      <p class="text-lg font-bold lowercase text-ink">{{ brand }}</p>
      <p class="mt-2 max-w-md text-sm text-neutral-500">
        {{ fullName }} — Un programa intensivo de programación, IA y automatización.
      </p>
    </div>
    <nav class="flex flex-wrap gap-x-5 gap-y-2" aria-label="Pie">
      @for (item of links; track item.label) {
        <a [routerLink]="item.path" class="text-sm text-neutral-500 hover:text-brand">
          {{ item.label }}
        </a>
      }
    </nav>
    <p class="text-xs text-neutral-400 lg:col-span-2">
      © {{ year }} {{ fullName }}. Todos los derechos reservados.
    </p>
  </div>
</footer>
