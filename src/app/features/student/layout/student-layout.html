<div class="student-shell">
  <header class="student-top">
    <div class="student-top-inner">
      <a routerLink="/alumno" class="student-brand" (click)="closeMenu()">
        <app-brand-logo size="sm" />
        <span class="student-brand-text">
          <span class="student-brand-name">{{ brandName }}</span>
          <span class="student-brand-tag">{{ brandTag }}</span>
        </span>
      </a>

      <nav class="student-nav" aria-label="Alumno">
        <a routerLink="/alumno" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
        <a routerLink="/alumno/calendario" routerLinkActive="is-active">Calendario</a>
        <a routerLink="/alumno/contenido" routerLinkActive="is-active">Contenido</a>
      </nav>

      <div class="student-top-actions">
        <p class="student-hello">Hola, {{ firstName() }}</p>
        <button type="button" class="student-logout" (click)="logout()" [disabled]="loggingOut()">
          {{ loggingOut() ? 'Saliendo…' : 'Salir' }}
        </button>
        <button
          type="button"
          class="student-menu-btn"
          [attr.aria-expanded]="menuOpen()"
          aria-label="Abrir menú"
          (click)="toggleMenu()"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    @if (menuOpen()) {
      <nav class="student-nav-mobile" aria-label="Alumno">
        <a routerLink="/alumno" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
          Inicio
        </a>
        <a routerLink="/alumno/calendario" routerLinkActive="is-active" (click)="closeMenu()">Calendario</a>
        <a routerLink="/alumno/contenido" routerLinkActive="is-active" (click)="closeMenu()">Contenido</a>
      </nav>
    }
  </header>

  <main class="student-main">
    <router-outlet />
  </main>
</div>
