<section id="precio" class="relative overflow-hidden bg-[#f7f7fb]">
  <div
    class="relative mx-auto w-full max-w-[1320px] px-4 py-14 sm:px-6 sm:py-16 lg:px-6 lg:py-20"
  >
    <header class="mx-auto max-w-2xl text-center">
      <h2
        class="text-balance text-[1.65rem] leading-[1.15] font-bold tracking-tight text-ink sm:text-3xl md:text-4xl"
      >
        {{ title }}
      </h2>
      <p
        class="mx-auto mt-4 max-w-xl text-pretty text-[14px] leading-relaxed text-[#6b6b80] sm:text-[15px] md:text-base"
      >
        {{ intro }}
      </p>
    </header>

    <div
      class="mx-auto mt-10 grid max-w-3xl gap-5 sm:mt-12 sm:grid-cols-2 sm:gap-6 md:items-stretch"
    >
      @for (plan of plans; track plan.id) {
        <article
          class="pricing-card relative flex h-full flex-col overflow-hidden rounded-[1.35rem]"
          [class.is-featured]="plan.featured"
        >
          <div class="flex flex-1 flex-col p-6 sm:p-7">
            @if (plan.badge) {
              <span
                class="mb-4 inline-flex w-fit rounded-full bg-white/20 px-3 py-1 text-[10px] font-bold tracking-[0.12em] text-white uppercase"
              >
                {{ plan.badge }}
              </span>
            }

            <h3
              class="text-[1.05rem] font-bold tracking-tight sm:text-lg"
              [class.text-white]="plan.featured"
              [class.text-ink]="!plan.featured"
            >
              {{ plan.name }}
            </h3>
            <p
              class="mt-2 text-[13px] leading-relaxed sm:text-sm"
              [class.text-white/75]="plan.featured"
              [class.text-[#6b6b80]]="!plan.featured"
            >
              {{ plan.description }}
            </p>

            <p class="mt-6 flex items-end gap-1.5">
              <span
                class="text-[2.35rem] leading-none font-bold tracking-tight tabular-nums sm:text-[2.6rem]"
                [class.text-white]="plan.featured"
                [class.text-ink]="!plan.featured"
              >
                {{ plan.priceLabel }}
              </span>
              <span
                class="pb-1 text-[13px] font-medium"
                [class.text-white/70]="plan.featured"
                [class.text-[#8a8a9c]]="!plan.featured"
              >
                {{ plan.priceNote }}
              </span>
            </p>

            <a
              [routerLink]="ctaPath"
              [queryParams]="{ plan: plan.id }"
              class="pricing-cta mt-6 inline-flex w-full items-center justify-center rounded-xl px-4 py-3 text-sm font-semibold transition-opacity hover:opacity-90"
              [class.pricing-cta--outline]="plan.ctaStyle === 'outline'"
              [class.pricing-cta--inverse]="plan.ctaStyle === 'inverse'"
            >
              {{ plan.ctaLabel }}
            </a>

            <ul class="mt-7 flex flex-col gap-3">
              @for (feature of plan.features; track feature) {
                <li class="flex items-start gap-2.5 text-[13px] leading-snug sm:text-sm">
                  <span
                    class="mt-0.5 flex size-5 shrink-0 items-center justify-center rounded-full"
                    [class.bg-white/20]="plan.featured"
                    [class.bg-brand-soft]="!plan.featured"
                    aria-hidden="true"
                  >
                    <svg
                      class="size-3"
                      [class.text-white]="plan.featured"
                      [class.text-brand]="!plan.featured"
                      viewBox="0 0 12 12"
                      fill="none"
                    >
                      <path
                        d="M2.5 6.2 4.8 8.5 9.5 3.5"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </span>
                  <span
                    [class.text-white/90]="plan.featured"
                    [class.text-[#4a4a5c]]="!plan.featured"
                  >
                    {{ feature }}
                  </span>
                </li>
              }
            </ul>
          </div>
        </article>
      }
    </div>
  </div>
</section>
