<section id="programa" class="relative overflow-hidden bg-white">
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_70%_0%,rgba(87,81,225,0.06),transparent_55%),radial-gradient(ellipse_at_15%_60%,rgba(255,194,36,0.05),transparent_45%)]"
    aria-hidden="true"
  ></div>

  <div
    class="relative mx-auto w-full max-w-[1320px] px-4 py-12 sm:px-6 sm:py-16 lg:px-6 lg:py-20"
  >
    <header class="mx-auto max-w-2xl text-center">
      <p
        class="mb-4 text-[11px] font-medium tracking-[0.18em] text-[#b0b0bc] uppercase sm:text-xs md:text-[13px]"
      >
        {{ eyebrow }}
      </p>
      <h2
        class="text-balance text-[1.5rem] leading-[1.15] font-bold tracking-tight text-ink sm:text-3xl md:text-4xl"
      >
        <span class="modules-marker">{{ title }}</span>
      </h2>
      <p
        class="mx-auto mt-4 max-w-prose text-pretty text-[14px] leading-relaxed text-[#6b6b80] sm:text-[15px] md:text-base"
      >
        {{ intro }}
      </p>
      <p
        class="mt-4 text-[11px] font-medium tracking-[0.14em] text-[#8a8a9c] uppercase sm:text-xs"
      >
        <span class="font-bold text-brand tabular-nums">{{ weeks }}</span>
        semanas
        <span class="mx-2 text-[#d0d0da]" aria-hidden="true">·</span>
        <span class="font-bold text-brand tabular-nums">{{ hours }}</span>
        horas
      </p>
    </header>

    <div class="mx-auto mt-8 w-full max-w-3xl sm:mt-10 md:mt-12">
      <div class="flex flex-col gap-2 sm:gap-2.5 md:gap-3" role="list">
        @for (mod of modules; track mod.id) {
          <article
            class="modules-card overflow-hidden rounded-xl border border-[#ececf3] bg-white/95 shadow-[0_8px_30px_rgba(22,20,57,0.04)] backdrop-blur-sm sm:rounded-2xl"
            role="listitem"
          >
            <button
              type="button"
              class="modules-trigger flex w-full min-h-12 cursor-pointer items-start gap-3 px-3.5 py-3.5 text-left sm:min-h-14 sm:items-center sm:gap-4 sm:px-5 sm:py-4"
              [attr.aria-expanded]="isModuleOpen(mod.id)"
              [attr.aria-controls]="'module-panel-' + mod.id"
              id="module-trigger-{{ mod.id }}"
              (click)="toggleModule(mod.id)"
            >
              <span
                class="mt-0.5 flex size-8 shrink-0 items-center justify-center rounded-lg bg-brand text-xs font-bold text-white sm:mt-0 sm:size-10 sm:rounded-xl sm:text-sm"
                aria-hidden="true"
              >
                {{ mod.id }}
              </span>

              <div class="min-w-0 flex-1">
                <p
                  class="text-pretty text-[14px] leading-snug font-semibold text-ink sm:text-[15px] md:text-base"
                >
                  {{ mod.title }}
                </p>
                <p
                  class="mt-1.5 flex flex-wrap items-center gap-x-1.5 gap-y-1 text-[11px] leading-none text-[#8a8a9c] sm:mt-1 sm:text-xs md:text-[13px]"
                >
                  <span>{{ weeksLabel(mod.weeks) }}</span>
                  <span class="text-[#d0d0da]" aria-hidden="true">·</span>
                  <span>{{ mod.hours }}</span>
                  <span class="text-[#d0d0da]" aria-hidden="true">·</span>
                  <span>{{ projectsLabel(mod.projectsCount) }}</span>
                </p>
              </div>

              <span
                class="modules-chevron mt-0.5 flex size-8 shrink-0 items-center justify-center rounded-full border border-[#ececf3] text-brand sm:mt-0"
                [class.is-open]="isModuleOpen(mod.id)"
                aria-hidden="true"
              >
                <svg class="size-3.5 sm:size-4" viewBox="0 0 16 16" fill="none">
                  <path
                    d="M4 6.5 8 10.5 12 6.5"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </button>

            <div
              class="modules-panel"
              [class.is-open]="isModuleOpen(mod.id)"
              [id]="'module-panel-' + mod.id"
              role="region"
              [attr.aria-labelledby]="'module-trigger-' + mod.id"
            >
              <div class="modules-panel-inner">
                <div class="border-t border-[#ececf3] px-3.5 pb-3.5 sm:px-5 sm:pb-5">
                  <p
                    class="pt-3.5 text-pretty text-[13px] leading-relaxed text-[#6b6b80] sm:pt-4 sm:text-sm"
                  >
                    {{ mod.objective }}
                  </p>

                  <div class="mt-3 flex flex-col gap-1.5 sm:mt-4 sm:gap-2">
                    @for (cls of mod.classes; track cls.day) {
                      <div
                        class="overflow-hidden rounded-lg border border-[#ececf3] sm:rounded-xl"
                      >
                        <button
                          type="button"
                          class="modules-trigger flex w-full min-h-11 cursor-pointer items-start gap-2.5 px-3 py-2.5 text-left sm:min-h-12 sm:items-center sm:gap-3 sm:px-3.5"
                          [attr.aria-expanded]="isClassOpen(mod.id, cls.day)"
                          [attr.aria-controls]="'class-panel-' + mod.id + '-' + cls.day"
                          [id]="'class-trigger-' + mod.id + '-' + cls.day"
                          (click)="toggleClass(mod.id, cls.day)"
                        >
                          <span
                            class="mt-0.5 shrink-0 rounded-md bg-ink px-1.5 py-0.5 font-mono text-[9px] font-semibold tracking-wide text-white uppercase sm:mt-0 sm:px-2 sm:text-[10px]"
                          >
                            D{{ cls.day }}
                          </span>
                          <span
                            class="min-w-0 flex-1 text-pretty text-[13px] leading-snug font-medium text-ink sm:text-sm"
                          >
                            <span class="text-[#8a8a9c]">Clase {{ cls.classNumber }}</span>
                            <span class="mx-1 text-[#d0d0da]" aria-hidden="true">·</span>
                            <span>{{ cls.title }}</span>
                          </span>
                          <span
                            class="modules-chevron mt-1 shrink-0 text-brand sm:mt-0"
                            [class.is-open]="isClassOpen(mod.id, cls.day)"
                            aria-hidden="true"
                          >
                            <svg class="size-3.5" viewBox="0 0 16 16" fill="none">
                              <path
                                d="M4 6.5 8 10.5 12 6.5"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                              />
                            </svg>
                          </span>
                        </button>

                        <div
                          class="modules-panel"
                          [class.is-open]="isClassOpen(mod.id, cls.day)"
                          [id]="'class-panel-' + mod.id + '-' + cls.day"
                          role="region"
                          [attr.aria-labelledby]="'class-trigger-' + mod.id + '-' + cls.day"
                        >
                          <div class="modules-panel-inner">
                            <div
                              class="border-t border-[#ececf3] px-3 pt-2.5 pb-3 sm:px-3.5 sm:pt-3 sm:pb-3.5"
                            >
                              <ul class="space-y-1.5 sm:space-y-2">
                                @for (item of cls.contents; track item) {
                                  <li
                                    class="flex gap-2 text-[13px] leading-snug text-[#6b6b80] sm:text-sm"
                                  >
                                    <span
                                      class="mt-[0.45em] size-1.5 shrink-0 rounded-full bg-brand"
                                      aria-hidden="true"
                                    ></span>
                                    <span class="min-w-0 text-pretty break-words">{{
                                      item
                                    }}</span>
                                  </li>
                                }
                              </ul>
                            </div>
                          </div>
                        </div>
                      </div>
                    }
                  </div>
                </div>
              </div>
            </div>
          </article>
        }
      </div>
    </div>
  </div>
</section>
