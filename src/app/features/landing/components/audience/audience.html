<section id="why-us" class="relative overflow-hidden bg-[#18191a] text-white">
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_80%_0%,rgba(87,81,225,0.12),transparent_50%),radial-gradient(ellipse_at_10%_70%,rgba(255,194,36,0.06),transparent_45%)]"
    aria-hidden="true"
  ></div>

  <div
    class="relative mx-auto w-full max-w-[1320px] px-4 py-12 sm:px-6 sm:py-16 lg:py-20"
    appReveal
  >
    <header class="max-w-2xl min-w-0 text-left">
      <p
        class="mb-2.5 text-[11px] font-medium tracking-[0.18em] text-white/45 uppercase sm:text-xs md:text-[13px]"
      >
        {{ eyebrow }}
      </p>
      <h2
        class="text-balance text-[1.5rem] leading-[1.15] font-bold tracking-tight text-white sm:text-3xl md:text-4xl"
      >
        <span class="audience-marker">{{ title }}</span>
      </h2>
      <p
        class="mt-4 max-w-prose text-pretty text-[14px] leading-relaxed text-[#c4c3d4] sm:text-[15px] md:text-base"
      >
        {{ intro }}
      </p>
    </header>

    <ul
      class="mt-10 grid grid-cols-1 gap-10 min-[480px]:grid-cols-2 min-[480px]:gap-x-6 min-[480px]:gap-y-12 sm:mt-12 md:mt-14 md:grid-cols-3 lg:grid-cols-5 lg:gap-x-5 xl:gap-x-8"
    >
      @for (reason of reasons; track reason.id) {
        <li class="min-w-0 text-left min-[480px]:text-center">
          <p
            class="audience-num text-[3.5rem] leading-none font-extrabold tracking-tight tabular-nums sm:text-[4rem] md:text-[4.5rem]"
            [class.is-highlight]="reason.highlight"
          >
            {{ reason.code }}
          </p>
          <h3
            class="mt-4 text-pretty text-[15px] leading-snug font-bold tracking-tight text-white sm:mt-5 sm:text-base"
          >
            {{ reason.title }}
          </h3>
          <p
            class="mt-2.5 max-w-[16rem] text-pretty text-[13px] leading-relaxed text-[#b7b6c9] min-[480px]:mx-auto min-[480px]:mt-3 sm:text-sm"
          >
            {{ reason.text }}
          </p>
        </li>
      }
    </ul>
  </div>
</section>
