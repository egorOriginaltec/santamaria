<section id="outcomes" class="relative overflow-hidden bg-[#18191a] text-white">
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_30%_0%,rgba(87,81,225,0.12),transparent_50%),radial-gradient(ellipse_at_85%_70%,rgba(255,194,36,0.06),transparent_45%)]"
    aria-hidden="true"
  ></div>

  <div
    class="relative mx-auto w-full max-w-[1320px] px-4 py-12 sm:px-6 sm:py-16 lg:py-20"
  >
    <header class="mx-auto max-w-2xl min-w-0 text-center">
      <p
        class="mb-4 text-[11px] font-medium tracking-[0.18em] text-white/45 uppercase sm:text-xs md:text-[13px]"
      >
        {{ eyebrow }}
      </p>
      <h2
        class="text-balance text-[1.5rem] leading-[1.15] font-bold tracking-tight text-white sm:text-3xl md:text-4xl"
      >
        <span class="outcomes-marker">{{ title }}</span>
      </h2>
      <p
        class="mx-auto mt-4 max-w-prose text-pretty text-[14px] leading-relaxed text-[#9a9aa3] sm:text-[15px] md:text-base"
      >
        {{ intro }}
      </p>
    </header>

    <ul class="mt-12 flex flex-col gap-12 sm:mt-14 sm:gap-16 lg:mt-16 lg:gap-20" role="list">
      @for (item of items; track item.id; let i = $index) {
        <li
          class="outcomes-row grid min-w-0 items-center gap-6 sm:gap-8 lg:grid-cols-2 lg:gap-12 xl:gap-16"
          [class.is-reversed]="isReversed(i)"
          role="listitem"
        >
          <div class="outcomes-media min-w-0">
            <div
              class="relative aspect-[16/10] overflow-hidden rounded-2xl border border-white/10 bg-white/[0.04]"
            >
              @if (item.videoSrc) {
                <video
                  class="h-full w-full object-cover"
                  [src]="item.videoSrc"
                  [attr.poster]="item.videoPoster || null"
                  muted
                  loop
                  playsinline
                  preload="metadata"
                  controls
                ></video>
              } @else {
                <div
                  class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-gradient-to-br from-white/[0.04] via-transparent to-[rgba(87,81,225,0.12)]"
                  aria-hidden="true"
                >
                  <span
                    class="flex size-12 items-center justify-center rounded-full border border-white/10 bg-white/[0.06] text-brand sm:size-14"
                  >
                    <svg class="size-5 sm:size-6" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M8 5.5v13l11-6.5L8 5.5Z" />
                    </svg>
                  </span>
                  <span
                    class="text-[11px] font-medium tracking-[0.16em] text-[#9a9aa3] uppercase"
                  >
                    Demo {{ item.code }}
                  </span>
                </div>
              }
            </div>
          </div>

          <div class="outcomes-copy min-w-0">
            <p
              class="text-[11px] font-bold tracking-[0.16em] text-brand uppercase sm:text-xs"
            >
              {{ item.code }}
            </p>
            <h3
              class="mt-3 text-pretty text-[1.25rem] leading-snug font-bold tracking-tight text-white sm:text-2xl"
            >
              {{ item.title }}
            </h3>
            <p
              class="outcomes-text mt-3 max-w-md text-pretty text-[14px] leading-relaxed text-[#9a9aa3] sm:mt-4 sm:text-[15px]"
            >
              {{ item.text }}
            </p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
