<section class="chart-card">
  <header class="mb-5 flex flex-wrap items-start justify-between gap-3">
    <div>
      <h2 class="text-base font-bold text-ink sm:text-lg">{{ title }}</h2>
      <p class="mt-1 text-sm text-[#8a8a9a]">{{ hint }}</p>
    </div>
    <div class="flex items-center gap-4 text-xs font-medium text-[#6b6b80]">
      <span class="inline-flex items-center gap-1.5">
        <span class="size-2 rounded-full bg-brand"></span>
        Current week
      </span>
      <span class="inline-flex items-center gap-1.5">
        <span class="size-2 rounded-full bg-[#c7c7d4]"></span>
        Previous week
      </span>
    </div>
  </header>

  <div class="relative overflow-hidden">
    <svg
      class="h-[220px] w-full"
      viewBox="0 0 640 220"
      role="img"
      [attr.aria-label]="title"
    >
      <defs>
        <linearGradient id="revenueFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5751e1" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#5751e1" stop-opacity="0" />
        </linearGradient>
      </defs>

      @for (point of points; track point.label; let i = $index) {
        <line
          [attr.x1]="24 + (i / (points.length - 1)) * 592"
          y1="20"
          [attr.x2]="24 + (i / (points.length - 1)) * 592"
          y2="200"
          stroke="#efeff5"
          stroke-width="1"
        />
      }

      <path [attr.d]="previousPath" fill="none" stroke="#c7c7d4" stroke-width="2.5" stroke-dasharray="5 5" />
      <path [attr.d]="currentArea" fill="url(#revenueFill)" />
      <path [attr.d]="currentPath" fill="none" stroke="#5751e1" stroke-width="3" stroke-linecap="round" />

      <circle [attr.cx]="highlight.x" [attr.cy]="highlight.y" r="5" fill="#5751e1" />
      <circle [attr.cx]="highlight.x" [attr.cy]="highlight.y" r="9" fill="#5751e1" fill-opacity="0.18" />
    </svg>

    <div
      class="chart-tooltip"
      [style.left.%]="(highlight.x / 640) * 100"
      [style.top.px]="highlight.y - 42"
    >
      {{ highlight.value }}
    </div>

    <div class="mt-1 grid grid-cols-7 gap-1 text-center text-[11px] font-medium text-[#8a8a9a]">
      @for (point of points; track point.label) {
        <span>{{ point.label }}</span>
      }
    </div>
  </div>
</section>
