<header class="dashboard-topbar">
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      class="grid size-10 place-items-center rounded-xl border border-[#ececf3] bg-white text-ink lg:hidden"
      aria-label="Abrir menú"
      (click)="toggleMenu()"
    >
      <svg class="size-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>

    <div class="min-w-0">
      <h1 class="truncate text-base font-semibold tracking-tight text-ink sm:text-lg">{{ heading() }}</h1>
    </div>
  </div>

</header>
