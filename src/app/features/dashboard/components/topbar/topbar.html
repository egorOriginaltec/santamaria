<header class="dashboard-topbar">
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      class="grid size-10 place-items-center rounded-xl border border-[#ececf3] bg-white text-ink lg:hidden"
      aria-label="Open menu"
      (click)="toggleMenu()"
    >
      <svg class="size-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>

    <div class="min-w-0">
      <h1 class="truncate text-xl font-bold tracking-tight text-ink sm:text-2xl">{{ title() }}</h1>
      <p class="mt-0.5 hidden text-xs text-[#8a8a9a] sm:block">Academy operations overview</p>
    </div>
  </div>

  <div class="flex items-center gap-2 sm:gap-3">
    <button
      type="button"
      class="hidden items-center gap-2 rounded-xl border border-[#ececf3] bg-white px-3 py-2 text-sm font-medium text-ink sm:inline-flex"
    >
      <svg class="size-4 text-[#8a8a9a]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6" />
        <path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      {{ period() }}
    </button>

    <button
      type="button"
      class="grid size-10 place-items-center rounded-xl border border-[#ececf3] bg-white text-[#6b6b80]"
      aria-label="Search"
    >
      <svg class="size-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7" />
        <path d="m16 16 3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    </button>

    <button
      type="button"
      class="grid size-10 place-items-center rounded-xl border border-[#ececf3] bg-white text-[#6b6b80]"
      aria-label="Notifications"
    >
      <svg class="size-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M12 3a5 5 0 0 0-5 5v2.2c0 .7-.2 1.3-.6 1.9L5 15h14l-1.4-2.9c-.4-.6-.6-1.2-.6-1.9V8a5 5 0 0 0-5-5Z"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path d="M10 18a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
    </button>

    <a
      routerLink="/login"
      class="inline-flex items-center gap-2 rounded-xl border border-[#ececf3] bg-white py-1.5 pr-3 pl-1.5"
    >
      <span
        class="grid size-8 place-items-center rounded-full bg-brand text-[11px] font-bold text-white"
        aria-hidden="true"
      >
        EG
      </span>
      <span class="hidden min-w-0 sm:block">
        <span class="block text-sm font-semibold leading-none text-ink">{{ userName }}</span>
        <span class="mt-1 block truncate text-[11px] text-[#8a8a9a]">{{ userEmail }}</span>
      </span>
    </a>
  </div>
</header>
