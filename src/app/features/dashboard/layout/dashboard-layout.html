<div class="dashboard-shell">
  @if (menuOpen()) {
    <button
      type="button"
      class="dashboard-backdrop lg:hidden"
      aria-label="Close menu overlay"
      (click)="closeMenu()"
    ></button>
  }

  <app-dashboard-sidebar [open]="menuOpen()" (closed)="closeMenu()" />

  <div class="dashboard-main min-w-0 flex-1">
    <app-dashboard-topbar (menuToggle)="openMenu()" />
    <main class="dashboard-content">
      <router-outlet />
    </main>
  </div>
</div>
